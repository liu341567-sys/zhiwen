name: Windows live publishing workbench
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/publishing/**
      - src/renderer/publishing*.js
      - src/renderer/publishing*.css
      - src/renderer/index.html
      - tests/publishing-workbench.cjs
      - .github/workflows/publishing-workbench.yml
permissions:
  contents: read
jobs:
  workbench:
    runs-on: windows-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run setup:electron
      - name: Verify live official fields and final submit at three display scales
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          & node tests/publishing-workbench.cjs 2>&1 | Tee-Object -FilePath 'workbench-checks.log'
          $code = $LASTEXITCODE
          $lines = Get-Content -LiteralPath 'workbench-checks.log'
          if ($code -eq 0) {
            $message = ($lines | Where-Object { $_ -match '^\{"publishingWorkbenchLayout":|^\d+ publishing workbench real-window checks passed' }) -join "`n"
            $message = $message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::notice title=Windows live workbench verification::$message"
          } else {
            $failure = @($lines | Where-Object { $_ -match '^\{"uiFailure":' })
            $message = if ($failure.Count) { $failure[-1] } else { ($lines | Select-Object -Last 12) -join "`n" }
            for ($offset = 0; $offset -lt $message.Length; $offset += 800) {
              $chunk = $message.Substring($offset, [Math]::Min(800, $message.Length - $offset)).Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Host "::error title=Windows live workbench failure::$chunk"
            }
          }
          exit $code
