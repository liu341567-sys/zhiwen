name: Windows checks and installer

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Electron executable
        run: npm run setup:electron
      - name: Test environment store
        run: npm test
      - name: Check JavaScript syntax
        run: npm run check
      - name: Test developer tools, recording, privacy and local exports
        shell: pwsh
        run: ./.github/scripts/test-developer.ps1
      - name: Test actual Chromium session isolation
        run: npm run test:integration
      - name: Test UI at 100%, 125% and 150% display scale
        shell: pwsh
        run: ./.github/scripts/test-ui.ps1
      - name: Test local publishing and native browser automation
        shell: pwsh
        run: ./.github/scripts/test-publishing.ps1
      - name: Upload UI screenshots and measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-UI-validation
          path: test-results/ui/*
          if-no-files-found: ignore
          retention-days: 14
      - name: Build Windows x64 installer
        shell: pwsh
        run: ./.github/scripts/build-windows.ps1 -Target nsis
      - name: Verify installed Windows application and icons
        id: installed-check
        shell: pwsh
        run: ./.github/scripts/test-installer.ps1
      - name: Upload installed application verification
        if: always() && steps.installed-check.outputs.verification_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: Windows-installed-validation
          path: ${{ steps.installed-check.outputs.verification_path }}
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Qiye-Windows-x64
          path: dist/Qiye-Setup-*-x64.exe
          if-no-files-found: error
          retention-days: 14
